name: build
run-name: Build openwrt packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated OpenWrt versions or stable/oldstable aliases"
        default: "24.10.8,25.12.5"
        required: false
      targets:
        description: "Comma-separated firmware targets, or all (selects package architectures)"
        default: "all"
        required: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sdk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Select upstream package architectures
        id: openwrt
        uses: Lochnair/openwrt-sdk-rust/actions/openwrt-matrix@61855be2aed1b0ebc692aab51179f6aa0e4baccc
        with:
          versions: ${{ inputs.versions || '24.10.8,25.12.5' }}
          targets: ${{ inputs.targets || 'all' }}

      - name: Select available Rust or official SDK images
        id: sdk
        env:
          OPENWRT_MATRIX: ${{ steps.openwrt.outputs.matrix }}
        run: python3 ci/matrix.py

  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    container:
      image: ${{ matrix.image }}
      options: --user root

    env:
      OPENWRT_VERSION: ${{ matrix.version }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      SDK_TARGET: ${{ matrix.target }}
      SDK_HAS_RUST: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: feed

      - name: Fix git ownership
        run: git config --global --add safe.directory '*'

      - name: Initialize feeds and compile every feed package
        working-directory: /builder
        run: python3 "$GITHUB_WORKSPACE/feed/ci/build.py" build

      - name: Collect packages and generate unsigned repositories
        if: ${{ !cancelled() }}
        working-directory: /builder
        run: python3 "$GITHUB_WORKSPACE/feed/ci/build.py" repository

      - name: Upload userspace repositories
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "repository-${{ matrix.version }}-${{ matrix.package_arch }}"
          path: output/repositories/
          if-no-files-found: warn

      - name: Upload target-specific artifacts separately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "target-specific-${{ matrix.version }}-${{ matrix.package_arch }}"
          path: output/target-specific/
          if-no-files-found: ignore
